name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build ProxmoxMCPSharp.sln -c Release
      - run: dotnet test ProxmoxMCPSharp.sln -c Release --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence-${{ matrix.os }}
          path: TestResults/*.trx
          retention-days: 7
          if-no-files-found: error
